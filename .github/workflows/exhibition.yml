# Build and publish the public exhibition to GitHub Pages.
# Runs in LIVE image mode automatically when the repository secret
# HAUNTED_STUDIO_IMAGE_API_KEY exists (a Cloudflare Workers AI token);
# otherwise the deterministic practice season (no keys, no cost).
# Manual trigger keeps publishing deliberate.
name: Publish exhibition
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  exhibition:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/exhibition.js
        env:
          HAUNTED_STUDIO_HOME: .haunted-studio-exhibition
          HAUNTED_STUDIO_ARTIFACT: ${{ secrets.HAUNTED_STUDIO_IMAGE_API_KEY != '' && 'image' || 'mock' }}
          HAUNTED_STUDIO_IMAGE_PROVIDER: cloudflare
          HAUNTED_STUDIO_IMAGE_API_KEY: ${{ secrets.HAUNTED_STUDIO_IMAGE_API_KEY }}
          HAUNTED_STUDIO_CF_ACCOUNT_ID: ${{ secrets.HAUNTED_STUDIO_CF_ACCOUNT_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: exhibition-site
      - id: deployment
        uses: actions/deploy-pages@v4
